name: Build installable Windows package

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/Install-Files.ps1'
      - '.github/scripts/Files-Setup.iss'
      - '.github/scripts/Generate-SelfCertPfx.ps1'
      - '.github/workflows/build-installer.yml'
      - 'Directory.Packages.props'
      - 'Files.slnx'
      - 'global.json'
      - 'src/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the package as a public prerelease
        required: false
        type: boolean
        default: true
      release_tag:
        description: Existing release tag to replace (leave blank to create a new release)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      version: ${{ steps.metadata.outputs.version }}
      setup_name: ${{ steps.metadata.outputs.setup_name }}
      bundle_name: ${{ steps.metadata.outputs.bundle_name }}
    env:
      CONFIGURATION: Release
      PLATFORM: x64
      WORKING_DIR: '${{ github.workspace }}'
      ARTIFACTS_STAGING_DIR: '${{ github.workspace }}\artifacts'
      APPX_PACKAGE_DIR: '${{ github.workspace }}\artifacts\AppxPackages\'
      APP_PROJECT_PATH: 'src\Files.App\Files.App.csproj'
      LAUNCHER_PROJECT_PATH: 'src\Files.App.Launcher\Files.App.Launcher.vcxproj'
      APPX_SELFSIGNED_CERT_PATH: '${{ github.workspace }}\.github\workflows\FilesApp_SelfSigned.pfx'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Inno Setup 6.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = Join-Path $env:TEMP "innosetup-6.7.4.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" `
            -OutFile $installerPath
          $expectedHash = "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
          $actualHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer SHA-256 mismatch."
          }
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found."
          }
          $languagePath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\Languages\Unofficial\ChineseSimplified.isl"
          $languageDirectory = Split-Path $languagePath -Parent
          New-Item -ItemType Directory -Path $languageDirectory -Force | Out-Null
          $languageDownload = Join-Path $env:TEMP "ChineseSimplified.isl"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/c2913c993858a781fcb455bac8b8949c1c366cb8/Files/Languages/Unofficial/ChineseSimplified.isl" `
            -OutFile $languageDownload
          $expectedLanguageHash = "7d544b9bb1d142cfa11f2e5d3cc8abe2e55f8e066c5124e3772675aa236e1278"
          $actualLanguageHash = (Get-FileHash $languageDownload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualLanguageHash -ne $expectedLanguageHash) {
            throw "Inno Setup Chinese language file SHA-256 mismatch."
          }
          Copy-Item $languageDownload $languagePath -Force
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Restore Files
        shell: pwsh
        run: |
          msbuild Files.slnx `
            -t:Restore `
            -p:Platform=$env:PLATFORM `
            -p:Configuration=$env:CONFIGURATION `
            -p:PublishReadyToRun=true `
            -v:quiet `
            -clp:ErrorsOnly

      - name: Restore NuGet packages for launcher
        shell: pwsh
        run: |
          nuget restore "$env:LAUNCHER_PROJECT_PATH" `
            -SolutionDirectory "$env:WORKING_DIR" `
            -Verbosity quiet

      - name: Create self-signed package certificate
        shell: pwsh
        run: ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination "$env:APPX_SELFSIGNED_CERT_PATH"

      - name: Build Files launcher
        shell: pwsh
        run: |
          msbuild "$env:LAUNCHER_PROJECT_PATH" `
            -t:Build `
            -p:Platform=$env:PLATFORM `
            -p:Configuration=$env:CONFIGURATION `
            -v:quiet
          $launcher = Join-Path $env:WORKING_DIR "src\Files.App\Assets\FilesOpenDialog\Files.App.Launcher.exe"
          if (-not (Test-Path $launcher) -or (Get-Item $launcher).Length -eq 0) {
            throw "Files.App.Launcher.exe was not produced."
          }

      - name: Build and package Files
        shell: pwsh
        run: |
          msbuild $env:APP_PROJECT_PATH `
            -t:Build `
            -p:Configuration=$env:CONFIGURATION `
            -p:Platform=$env:PLATFORM `
            -p:AppxBundlePlatforms=$env:PLATFORM `
            -p:AppxBundle=Always `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir=$env:APPX_PACKAGE_DIR `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile=$env:APPX_SELFSIGNED_CERT_PATH `
            -p:PackageCertificatePassword="" `
            -p:PackageCertificateThumbprint="" `
            -v:quiet `
            -clp:ErrorsOnly

      - name: Prepare install package
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = [xml](Get-Content "src\Files.App\Package.appxmanifest" -Raw)
          $version = [string]$manifest.Package.Identity.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version was not found in Package.appxmanifest."
          }

          $packagesRoot = Join-Path $env:ARTIFACTS_STAGING_DIR "AppxPackages"
          $bundle = Get-ChildItem -Path $packagesRoot -Recurse -File -Filter "*.msixbundle" |
            Select-Object -First 1
          if (-not $bundle) {
            throw "No .msixbundle was produced."
          }
          $bundleName = "Files.App_${version}_x64.msixbundle"
          Copy-Item $bundle.FullName (Join-Path $env:ARTIFACTS_STAGING_DIR $bundleName)

          $pfxPassword = [System.Security.SecureString]::new()
          $certificate = Import-PfxCertificate `
            -FilePath $env:APPX_SELFSIGNED_CERT_PATH `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $pfxPassword
          if (-not $certificate) {
            throw "Could not load the package signing certificate."
          }
          Export-Certificate `
            -Cert $certificate `
            -FilePath (Join-Path $env:ARTIFACTS_STAGING_DIR "FilesApp_SelfSigned.cer") `
            -Type CERT | Out-Null
          Remove-Item $env:APPX_SELFSIGNED_CERT_PATH -Force

          Get-ChildItem -Path $packagesRoot -Recurse -File |
            Where-Object { $_.Extension -in @(".appxsym", ".msixupload") } |
            Remove-Item -Force
          Copy-Item ".github\scripts\Install-Files.ps1" $env:ARTIFACTS_STAGING_DIR

          $setupName = "Files-$version-Windows-x64-Setup.exe"

          "version=$version" >> $env:GITHUB_OUTPUT
          "setup_name=$setupName" >> $env:GITHUB_OUTPUT
          "bundle_name=$bundleName" >> $env:GITHUB_OUTPUT
          "artifact_name=Files-Windows-x64-$version-run-$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - name: Build EXE installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          & $env:INNO_SETUP_COMPILER /Qp ".github\scripts\Files-Setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          $setup = Join-Path $env:ARTIFACTS_STAGING_DIR "${{ steps.metadata.outputs.setup_name }}"
          if (-not (Test-Path $setup) -or (Get-Item $setup).Length -eq 0) {
            throw "The EXE installer was not produced."
          }

      - name: Install EXE package without Windows App SDK Framework
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $runtimePackages = @(
            Get-AppxPackage |
              Where-Object {
                $_.Name -like "Microsoft.WindowsAppRuntime.*" -or
                $_.Name -like "MicrosoftCorporationII.WinAppRuntime.*" -or
                $_.Name -like "Microsoft.WinAppRuntime.DDLM.*"
              }
          )
          foreach ($runtimePackage in $runtimePackages) {
            Remove-AppxPackage `
              -Package $runtimePackage.PackageFullName `
              -Confirm:$false `
              -ErrorAction Stop
          }
          $remainingRuntimePackages = @(
            Get-AppxPackage |
              Where-Object {
                $_.Name -like "Microsoft.WindowsAppRuntime.*" -or
                $_.Name -like "MicrosoftCorporationII.WinAppRuntime.*" -or
                $_.Name -like "Microsoft.WinAppRuntime.DDLM.*"
              }
          )
          if ($remainingRuntimePackages.Count -gt 0) {
            throw "The Windows runner still has a Windows App SDK Framework package registered; cannot verify self-contained installation."
          }
          Write-Output "Verified the runner user has no Windows App SDK Framework packages before installation."

          $setup = Join-Path $env:ARTIFACTS_STAGING_DIR "${{ steps.metadata.outputs.setup_name }}"
          $logPath = Join-Path $env:TEMP "FilesCommunityInstall-$($env:APP_VERSION).log"
          $setupLogPath = Join-Path $env:TEMP "FilesSetup-$($env:APP_VERSION).log"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            '/DIR="C:\Program Files\WindowsApps"',
            "/TASKS=desktopicon",
            "/LOG=$setupLogPath"
          )
          $process = Start-Process `
            -FilePath $setup `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $logPath) {
              Get-Content $logPath
            }
            throw "The EXE installer failed on the Windows runner with exit code $($process.ExitCode)."
          }

          $installedPackage = Get-AppxPackage -Name "FilesDev" |
            Where-Object { $_.PackageFamilyName -eq "FilesDev_ykqwq8d6ps0ag" } |
            Select-Object -First 1
          if (-not $installedPackage -or
              $installedPackage.Status -ne "Ok" -or
              $installedPackage.Version.ToString() -ne $env:APP_VERSION) {
            if (Test-Path $logPath) {
              Get-Content $logPath
            }
            throw "The EXE installer completed without registering the expected Files package."
          }
          $runtimePackages = @(
            Get-AppxPackage |
              Where-Object {
                $_.Name -like "Microsoft.WindowsAppRuntime.*" -or
                $_.Name -like "MicrosoftCorporationII.WinAppRuntime.*" -or
                $_.Name -like "Microsoft.WinAppRuntime.DDLM.*"
              }
          )
          if ($runtimePackages.Count -gt 0) {
            throw "Files installation unexpectedly registered Windows App SDK Framework packages."
          }

          $expectedLocation = [System.IO.Path]::GetFullPath("C:\Program Files\WindowsApps")
          $installedLocation = [System.IO.Path]::GetFullPath($installedPackage.InstallLocation)
          if (-not $installedLocation.StartsWith(
              "$expectedLocation\",
              [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Files was installed outside the selected WindowsApps volume."
          }

          $desktopDirectories = @(
            [Environment]::GetFolderPath([System.Environment+SpecialFolder]::Desktop)
            [Environment]::GetFolderPath([System.Environment+SpecialFolder]::CommonDesktopDirectory)
          ) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -Unique
          $desktopShortcut = $desktopDirectories |
            ForEach-Object { Join-Path $_ "Files.lnk" } |
            Where-Object { Test-Path -Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $desktopShortcut) {
            if (Test-Path $setupLogPath) {
              Get-Content $setupLogPath | Select-String -Pattern "desktop|Files.lnk|Creating icon|Create shortcut"
            }
            throw "The installer did not create the requested desktop shortcut."
          }
          Write-Output "Verified Files $env:APP_VERSION installation and desktop shortcut at $desktopShortcut on the Windows runner."

          $launchStartedAt = Get-Date
          $appUserModelId = "FilesDev_ykqwq8d6ps0ag!App"
          Start-Process `
            -FilePath (Join-Path $env:WINDIR "explorer.exe") `
            -ArgumentList "shell:AppsFolder\$appUserModelId"
          $launchDeadline = (Get-Date).AddSeconds(90)
          $appProcess = $null
          do {
            $appProcess = Get-Process -Name "Files" -ErrorAction SilentlyContinue |
              Where-Object { $_.StartTime -ge $launchStartedAt } |
              Sort-Object StartTime -Descending |
              Select-Object -First 1
            if ($appProcess) {
              $appProcess.Refresh()
              if ($appProcess.MainWindowHandle -ne [IntPtr]::Zero -and $appProcess.Responding) {
                break
              }
            }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $launchDeadline)

          if (-not $appProcess -or
              $appProcess.MainWindowHandle -eq [IntPtr]::Zero -or
              -not $appProcess.Responding) {
            Get-WinEvent `
              -FilterHashtable @{ LogName = "Application"; StartTime = $launchStartedAt } `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match "Files\.exe|FilesDev|WindowsAppRuntime" } |
              Select-Object -First 15 TimeCreated, Id, ProviderName, Message |
              Format-List
            throw "Files did not open a responsive main window within 90 seconds."
          }

          $appProcessId = $appProcess.Id
          Start-Sleep -Seconds 10
          $appProcess = Get-Process -Id $appProcessId -ErrorAction SilentlyContinue
          if (-not $appProcess) {
            throw "Files exited within 10 seconds of launch."
          }
          $appProcess.Refresh()
          if ($appProcess.MainWindowHandle -eq [IntPtr]::Zero -or -not $appProcess.Responding) {
            throw "Files stopped responding within 10 seconds of launch."
          }
          Write-Output "Verified Files $env:APP_VERSION opened a responsive main window and stayed responsive for 10 seconds."

      - name: Upload install package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ env.ARTIFACTS_STAGING_DIR }}\${{ steps.metadata.outputs.setup_name }}
            ${{ env.ARTIFACTS_STAGING_DIR }}\${{ steps.metadata.outputs.bundle_name }}
            ${{ env.ARTIFACTS_STAGING_DIR }}\FilesApp_SelfSigned.cer
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download install package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Publish or replace release with EXE only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_TITLE: Files Community Build ${{ needs.build.outputs.version }} (Windows x64)
          SETUP_NAME: ${{ needs.build.outputs.setup_name }}
          BUNDLE_NAME: ${{ needs.build.outputs.bundle_name }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            RELEASE_TAG="community-v${{ needs.build.outputs.version }}-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          NOTES="$(printf '%s\n' \
            '这是基于 Files Community 源码构建的非官方 Windows x64 版本，不代表官方发行。' \
            '' \
            '### 修改说明' \
            '- 改为 Windows App SDK 自包含部署：Framework 运行时随 Files 应用包部署，不需要预装或单独安装 Windows App SDK Framework 包。' \
            '- 保留 MSIX 应用身份，继续支持 Files 的 Windows 文件关联、协议和 Shell 集成。' \
            '- 改进安装结束阶段：显示部署状态，部署超时或失败时明确报错并保留诊断日志。' \
            '- 安装完成页提供启动选项；通过原始用户上下文启动 Files，避免继承安装器管理员权限。' \
            '- 发布门槛增加无 Windows App SDK Framework 的 Windows Actions 临时环境安装、桌面快捷方式、启动及持续响应检查。' \
            '' \
            '### 安装' \
            '- 推荐下载 Setup.exe，以管理员身份运行；可选择 WindowsApps 包卷并勾选桌面快捷方式。' \
            '- 同时提供 MSIX Bundle 和自签名证书，直接安装 Bundle 前需信任该证书。' \
            '- Setup.exe 未使用 Files Community 官方签名；本版本不是官方 Files Community Release。')"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            done <<< "$ASSETS"
            gh release upload "$RELEASE_TAG" \
              "release-assets/$SETUP_NAME" \
              "release-assets/$BUNDLE_NAME" \
              "release-assets/FilesApp_SelfSigned.cer" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              "release-assets/$SETUP_NAME" \
              "release-assets/$BUNDLE_NAME" \
              "release-assets/FilesApp_SelfSigned.cer" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
